        :root {
          --primary-color: #65a30d;
          --primary-hover: #4d7c0f;
          --bg-app: #f8fafc;
          --bg-card: #ffffff;
          --border-color: #e2e8f0;
          --text-main: #0f172a;
          --text-muted: #64748b;
          --radius-sm: 8px;
          --radius-md: 12px;
          --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: "Quicksand", system-ui, sans-serif;
          background-color: var(--bg-app);
          color: var(--text-main);
          height: 100vh;
          overflow: hidden;
          display: flex;
        }

        .app-container {
          display: flex;
          width: 100vw;
          height: 100vh;
        }

        .sidebar {
          width: 420px;
          min-width: 380px;
          background: var(--bg-card);
          border-right: 1px solid var(--border-color);
          display: flex;
          flex-direction: column;
          height: 100%;
          z-index: 10;
          box-shadow: var(--shadow-sm);
        }

        .sidebar-header {
          padding: 20px;
          border-bottom: 1px solid var(--border-color);
          background: #ffffff;
        }

        .sidebar-header h1 {
          font-size: 1.3rem;
          font-weight: 700;
          color: var(--primary-color);
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .sidebar-header p {
          font-size: 0.85rem;
          color: var(--text-muted);
          margin-top: 4px;
        }

        .sidebar-content {
          flex: 1;
          overflow-y: auto;
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }

        .sidebar-footer {
          padding: 16px 20px;
          border-top: 1px solid var(--border-color);
          background: #ffffff;
        }

        .form-section {
          background: #f8fafc;
          border: 1px solid var(--border-color);
          border-radius: var(--radius-md);
          padding: 16px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        .form-section-title {
          font-size: 0.9rem;
          font-weight: 700;
          color: var(--text-main);
          text-transform: uppercase;
          letter-spacing: 0.05em;
          margin-bottom: 4px;
        }

        .form-group {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        .form-group label {
          font-size: 0.88rem;
          font-weight: 600;
          color: #334155;
        }

        .form-control {
          width: 100%;
          padding: 10px 12px;
          font-size: 0.9rem;
          font-family: "Quicksand", sans-serif;
          font-weight: 500;
          color: var(--text-main);
          background-color: #ffffff;
          border: 1px solid var(--border-color);
          border-radius: var(--radius-sm);
        }

        .form-control:focus {
          outline: none;
          border-color: var(--primary-color);
          box-shadow: 0 0 0 3px rgba(101, 163, 13, 0.2);
        }

        textarea.form-control {
          resize: vertical;
          min-height: 90px;
        }

        .color-picker-wrapper {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        input[type="color"].form-control-color {
          -webkit-appearance: none;
          appearance: none;
          border: 1px solid var(--border-color);
          border-radius: var(--radius-sm);
          width: 44px;
          height: 38px;
          padding: 3px;
          cursor: pointer;
          background-color: #ffffff;
        }

        .row-2 {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }

        .btn-btn-primary {
          width: 100%;
          padding: 12px 20px;
          background-color: var(--primary-color);
          color: white;
          font-size: 1rem;
          font-family: "Quicksand", sans-serif;
          font-weight: 700;
          border: none;
          border-radius: var(--radius-sm);
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
        }

        .btn-btn-primary:hover {
          background-color: var(--primary-hover);
        }

        .preview-container {
          flex: 1;
          background-color: #cbd5e1;
          display: flex;
          flex-direction: column;
          height: 100%;
          position: relative;
          overflow: hidden;
        }

        .preview-toolbar {
          height: 52px;
          background: var(--bg-card);
          border-bottom: 1px solid var(--border-color);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 20px;
          z-index: 5;
        }

        .toolbar-title {
          font-size: 0.9rem;
          font-weight: 600;
          color: var(--text-muted);
        }

        .zoom-controls {
          display: flex;
          align-items: center;
          gap: 8px;
          background: #f1f5f9;
          padding: 4px;
          border-radius: var(--radius-sm);
        }

        .btn-tool {
          background: white;
          border: 1px solid var(--border-color);
          border-radius: 6px;
          padding: 6px 12px;
          font-size: 0.85rem;
          font-family: "Quicksand", sans-serif;
          font-weight: 600;
          color: var(--text-main);
          cursor: pointer;
        }

        .zoom-level {
          font-size: 0.85rem;
          font-weight: 700;
          min-width: 50px;
          text-align: center;
        }

        .preview-viewport {
          flex: 1;
          overflow: auto;
          display: flex;
          justify-content: center;
          align-items: flex-start;
          padding: 40px;
          position: relative;
        }

        /* KHỔ GIẤY A4 (210mm x 297mm) */
        .a4-page {
          width: 210mm;
          height: 297mm;
          min-width: 210mm;
          min-height: 297mm;
          max-width: 210mm;
          max-height: 297mm;
          background-color: #ffffff;
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
          position: relative;
          box-sizing: border-box;
          transform-origin: top center;
          padding: 0 !important;
          margin: 0;
          overflow: hidden !important;
        }

        /* LỚP FONT Ô LI NỀN */
        .notebook-bg {
          position: absolute;
          z-index: 1;
          pointer-events: none;
          box-sizing: border-box;
          white-space: pre;
          overflow: hidden;
          margin: 0 !important;
          padding: 0 !important;
          letter-spacing: 0;
        }

        /* ĐẦU TRANG */
        .page-header {
          position: absolute;
          top: 10mm;
          left: 10mm;
          right: 10mm;
          z-index: 2;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .page-header .sheet-title {
          font-size: 14pt;
          font-weight: bold;
          color: #000;
          text-transform: uppercase;
          text-align: center;
          width: 100%;
        }

        /* THÂN TRANG BÀI VIẾT */
        .page-body {
          position: absolute;
          z-index: 2;
          box-sizing: border-box;
          overflow: hidden;
        }

        .practice-title {
          margin-bottom: 0 !important;
          color: #000;
          text-align: center;
          display: block;
        }

        .practice-content {
          white-space: pre-wrap;
          word-break: break-word;
          color: #000000;
          display: block;
        }

        /* CHÂN TRANG */
        .page-footer {
          position: absolute;
          bottom: 10mm;
          left: 10mm;
          right: 10mm;
          z-index: 2;
          text-align: center;
          font-size: 8.5pt;
          color: #475569;
        }

        /* KHI BẬT TRÌNH IN PRINT */
        @media print {
          @page {
            size: A4 portrait;
            margin: 0;
          }
          body {
            background: #ffffff !important;
            overflow: visible !important;
          }
          .sidebar,
          .preview-toolbar {
            display: none !important;
          }
          .preview-container,
          .preview-viewport {
            padding: 0 !important;
            margin: 0 !important;
            overflow: visible !important;
            background: #ffffff !important;
          }
          .a4-page {
            box-shadow: none !important;
            transform: scale(1) !important;
            margin: 0 !important;
            page-break-inside: avoid !important;
            page-break-after: avoid !important;
          }
        }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- SIDEBAR BÊN TRÁI -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"

              <path d="M12 20h9"></path>
              <path
                d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"
              ></path>
            </svg>
            Xa Trục Thảo
          </h1>
          <p>Tạo phiếu Tập Viết tùy chỉnh</p>
        </div>

        <div class="sidebar-content">
          <!-- 1. Loại vở & Ô li -->
          <div class="form-section">
            <div class="form-section-title">Loại vở Ô li (Khổ A4)</div>

            <div class="form-group">
              <label for="gridType">Loại vở</label>
              <select id="gridType" class="form-control">
                <option value="4li-2.5mm">4 li 2.5mm</option>
                <option value="5li-2.5mm" selected>5 li 2.5mm</option>
                <option value="5li-2mm">5 li 2mm</option>
              </select>
            </div>

            <div class="form-group">
              <label for="gridStyle">Loại ô li</label>
              <select id="gridStyle" class="form-control">
                <option value="normal" selected>Bình thường</option>
                <option value="midline">Kẻ ngang giữa ô</option>
              </select>
            </div>

            <div class="form-group">
              <label for="pageMargin">Lề trang A4 (mm)</label>
              <input
                type="number"
                id="pageMargin"
                class="form-control"
                spellcheck="false"
                value="20"
                min="0"
                max="50"
                step="1"

            </div>

            <div class="form-group">
              <label for="gridColor">Màu vở (Đường kẻ ô li)</label>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="gridColor"
                  class="form-control-color"
                  value="#cbd5e1"
                />
                <input
                  type="text"
                  id="gridColorHex"
                  class="form-control"
                  spellcheck="false"
                  value="#cbd5e1"
                />
              </div>
            </div>
          </div>

          <!-- 2. Thông tin phiếu -->
          <div class="form-section">
            <div class="form-section-title">Thông tin phiếu</div>
            <div class="form-group">
              <label for="sheetTitle">Tên phiếu (Đầu trang)</label>
              <input
                type="text"
                id="sheetTitle"
                class="form-control"
                spellcheck="false"
                value="PHIẾU LUYỆN TẬP VIẾT CHỮ"
              />
            </div>
            <div class="form-group">
              <label>Chân trang</label>
              <input
                type="text"
                class="form-control"
                spellcheck="false"
                value="Tạo bởi trang web và font do Xa Trục Thảo phát triển"
                readonly
                style="background-color: #f1f5f9; color: #64748b"
              />
            </div>
          </div>

          <!-- 3. Nội dung luyện viết -->
          <div class="form-section">
            <div class="form-section-title">Nội dung luyện viết</div>
            <div class="form-group">
              <label for="contentTitle"
                >Tiêu đề bài viết (không bắt buộc)</label
              >
              <input
                type="text"
                id="contentTitle"
                class="form-control"
                spellcheck="false"
                placeholder="Ví dụ: Bài 1: Luyện nét cơ bản"
              />
            </div>
            <div class="form-group">
              <label for="contentText">Nội dung bài viết</label>
              <textarea
                id="contentText"
                class="form-control"
                spellcheck="false"
                placeholder="Nhập nội dung tập viết tại đây..."
              >
a ă â b c d đ e ê g h i k l m n o ô ơ p q r s t u ư v x y
Ngày đầu tiên đi học. Mẹ dắt tay đến trường.</textarea
              >
            </div>
          </div>

          <!-- 4. Định dạng chữ -->
          <div class="form-section">
            <div class="form-section-title">Định dạng chữ & Căn chỉnh</div>

            <div class="form-group">
              <label for="fontFamily">Font chữ</label>
              <select id="fontFamily" class="form-control">
                <option value="XTTKCM-TVNDC">Tập viết Nét đều Co</option>
                <option value="XTTKCM-TVNDG">Tập viết Nét đều Giãn</option>
                <option value="XTTKCM-TVTDC">Tập viết Thanh đậm Co</option>
                <option value="XTTKCM-TVTDG">Tập viết Thanh đậm Giãn</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fontSizeType">Cỡ chữ</label>
              <select id="fontSizeType" class="form-control">
                <option value="medium">Chữ vừa: o cao 2 ô li</option>
                <option value="small">Chữ nhỏ: o cao 1 ô li</option>
              </select>
              <div
                id="fontSizeNote"
                style="
                  font-size: 0.75rem;
                  color: var(--primary-color);
                  margin-top: 2px;
                "
              >
                Kích thước tương ứng: 73.4 pt
              </div>
            </div>

            <div class="form-group">
              <label for="textColor">Màu chữ</label>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="textColor"
                  class="form-control-color"
                  value="#000000"
                />
                <input
                  type="text"
                  id="textColorHex"
                  class="form-control"
                  spellcheck="false"
                  value="#000000"
                />
              </div>
            </div>

            <div class="row-2">
              <div class="form-group">
                <label for="lineSpacing">Cách dòng (mm)</label>
                <input
                  type="number"
                  id="lineSpacing"
                  class="form-control"
                  spellcheck="false"
                  value="12.5"
                  min="5"
                  max="50"
                  step="0.5"
                />
              </div>
              <div class="form-group">
                <label for="baselineOffset">Lệch đường đậm (mm)</label>
                <input
                  type="number"
                  id="baselineOffset"
                  class="form-control"
                  spellcheck="false"
                  value="0"
                  min="-12.5"
                  max="12.5"
                  step="0.5"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="leftMargin">Cách lề trái (mm)</label>
              <input
                type="number"
                id="leftMargin"
                class="form-control"
                spellcheck="false"
                value="12.5"
                min="0"
                max="50"
                step="0.5"
              />
            </div>
          </div>
        </div>

        <div class="sidebar-footer">
          <button id="btnPrintPDF" class="btn-btn-primary">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path
                d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
              ></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            In PDF
          </button>
        </div>
      </aside>

      <!-- PREVIEW BÊN PHẢI -->
      <main class="preview-container">
        <div class="preview-toolbar">
          <span class="toolbar-title">Xem trước trực quan</span>
          <div class="zoom-controls">
            <button id="btnZoomOut" class="btn-tool" title="Thu nhỏ">-</button>
            <span id="zoomLevel" class="zoom-level">100%</span>
            <button id="btnZoomIn" class="btn-tool" title="Phóng to">+</button>
            <button id="btnZoomFit" class="btn-tool" style="margin-left: 6px">
              Vừa trang
            </button>
          </div>
        </div>

        <div class="preview-viewport" id="previewViewport">
          <div class="a4-page" id="a4Page">
            <!-- Thẻ Nền Font Ô Li -->
            <div class="notebook-bg" id="gridBackground"></div>

            <header class="page-header">
              <div class="sheet-title" id="displaySheetTitle">
                PHIẾU LUYỆN TẬP VIẾT CHỮ
              </div>
            </header>

            <div class="page-body" id="pageBody">
              <div class="practice-title" id="displayContentTitle"></div>
              <div class="practice-content" id="displayContentText"></div>
            </div>

            <footer class="page-footer">
              Tạo bởi trang web và font do Xa Trục Thảo phát triển
            </footer>
          </div>
        </div>
      </main>
    </div>

    <script>
      // --- BẢNG ÁNH XÁ CỠ CHỮ PT THEO Ô LI VÀ LOẠI CHỮ ---
      const FONT_SIZE_MAP = {
        "2.5mm": {
          medium: 73.4, // Chữ vừa: o cao 2 ô li
          small: 36.7, // Chữ nhỏ: o cao 1 ô li
        },
        "2mm": {
          medium: 58.8, // Chữ vừa: o cao 2 ô li
          small: 29.4, // Chữ nhỏ: o cao 1 ô li
        },
      };

      // --- BẢNG CẤU HÌNH THÔNG SỐ FONT Ô LI TƯƠNG ỨNG VỚI LOẠI VỞ ---
      const FONT_GRID_MAP = {
        "4li-2.5mm": {
          font: "XTT-OLI4",
          size: 73.4,
          lineHeightMm: 10.0, // 4 li x 2.5mm = 10mm
          step: 2.5,
          rowHeight: 10.0,
        },
        "5li-2.5mm": {
          font: "XTT-OLI5",
          size: 73.4,
          lineHeightMm: 12.5, // 5 li x 2.5mm = 12.5mm
          step: 2.5,
          rowHeight: 12.5,
        },
        "5li-2mm": {
          font: "XTT-OLI5",
          size: 58.8,
          lineHeightMm: 10.0, // 5 li x 2mm = 10mm
          step: 2.0,
          rowHeight: 10.0,
        },
      };

      // --- CÁC ELEMENT DOM ---
      const gridTypeEl = document.getElementById("gridType");
      const gridStyleEl = document.getElementById("gridStyle");
      const pageMarginEl = document.getElementById("pageMargin");
      const gridColorEl = document.getElementById("gridColor");
      const gridColorHexEl = document.getElementById("gridColorHex");

      const sheetTitleEl = document.getElementById("sheetTitle");
      const contentTitleEl = document.getElementById("contentTitle");
      const contentTextEl = document.getElementById("contentText");

      const fontFamilyEl = document.getElementById("fontFamily");
      const fontSizeTypeEl = document.getElementById("fontSizeType");
      const textColorEl = document.getElementById("textColor");
      const textColorHexEl = document.getElementById("textColorHex");

      const lineSpacingEl = document.getElementById("lineSpacing");
      const baselineOffsetEl = document.getElementById("baselineOffset");
      const leftMarginEl = document.getElementById("leftMargin");

      const displaySheetTitle = document.getElementById("displaySheetTitle");
      const displayContentTitle = document.getElementById(
        "displayContentTitle",
      );
      const displayContentText = document.getElementById("displayContentText");
      const fontSizeNote = document.getElementById("fontSizeNote");

      // Element Zoom, Trang A4 & Ô li Nền
      const a4Page = document.getElementById("a4Page");
      const gridBackground = document.getElementById("gridBackground");
      const pageBody = document.getElementById("pageBody");
      const previewViewport = document.getElementById("previewViewport");
      const btnZoomIn = document.getElementById("btnZoomIn");
      const btnZoomOut = document.getElementById("btnZoomOut");
      const btnZoomFit = document.getElementById("btnZoomFit");
      const zoomLevelEl = document.getElementById("zoomLevel");
      const btnPrintPDF =
        document.getElementById("btnPrintPDF") ||
        document.getElementById("btnDownloadPDF");

      let currentZoom = 0.85;

      // Tự động điều chỉnh khoảng cách dòng chuẩn khi thay đổi Loại vở
      if (gridTypeEl) {
        gridTypeEl.addEventListener("change", () => {
          const type = gridTypeEl.value;
          if (type === "5li-2.5mm") {
            lineSpacingEl.value = 12.5;
          } else if (type === "4li-2.5mm") {
            lineSpacingEl.value = 10.0;
          } else if (type === "5li-2mm") {
            lineSpacingEl.value = 10.0;
          }
          renderPreview();
        });
      }

      // --- HÀM TẠO LƯỚI Ô LI BẰNG FONT ---
      function updateFontGrid(type, style, colorHex, pageMargin) {
        if (!gridBackground) return;

        const config = FONT_GRID_MAP[type] || FONT_GRID_MAP["5li-2.5mm"];
        const baseColor = colorHex || "#cbd5e1";

        const W_mm = 210 - pageMargin * 2;
        const H_mm = 297 - pageMargin * 2;

        const cols = Math.floor(W_mm / config.step);
        const rows = Math.floor(H_mm / config.rowHeight);

        const repeatChar = style === "midline" ? "a" : "b";
        const rowString = repeatChar.repeat(cols);
        const fullGridText = Array(rows).fill(rowString).join("\n");

        gridBackground.style.fontFamily = `"${config.font}", sans-serif`;
        gridBackground.style.fontSize = `${config.size}pt`;
        gridBackground.style.lineHeight = `${config.lineHeightMm}mm`;
        gridBackground.style.color = baseColor;
        gridBackground.textContent = fullGridText;
      }

      // --- HÀM CẬP NHẬT TOÀN BỘ PHIẾU XEM TRƯỚC (REALTIME) ---
      function renderPreview() {
        if (!gridTypeEl || !pageMarginEl) return;

        const type = gridTypeEl.value;
        const style = gridStyleEl ? gridStyleEl.value : "normal";
        const pageMargin = parseFloat(pageMarginEl.value) || 20;
        const gridColor = gridColorEl ? gridColorEl.value : "#cbd5e1";
        const sheetTitle = sheetTitleEl ? sheetTitleEl.value : "";
        const contentTitle = contentTitleEl ? contentTitleEl.value : "";
        const contentText = contentTextEl ? contentTextEl.value : "";
        const font = fontFamilyEl ? fontFamilyEl.value : "XTTKCM-TVNDC";
        const sizeType = fontSizeTypeEl ? fontSizeTypeEl.value : "medium";
        const textColor = textColorEl ? textColorEl.value : "#000000";
        const lineSpacing = lineSpacingEl
          ? parseFloat(lineSpacingEl.value) || 12.5
          : 12.5;
        const baselineOffset = baselineOffsetEl
          ? parseFloat(baselineOffsetEl.value) || 0
          : 0;
        const leftMargin = leftMarginEl
          ? parseFloat(leftMarginEl.value) || 10
          : 10;

        // 1. Định vị Lớp Ô li Nền và Thân bài viết
        const topPos = `${pageMargin}mm`;
        const leftPos = `${pageMargin}mm`;
        const widthVal = `calc(210mm - ${pageMargin * 2}mm)`;
        const heightVal = `calc(297mm - ${pageMargin * 2}mm)`;

        if (gridBackground) {
          gridBackground.style.top = topPos;
          gridBackground.style.left = leftPos;
          gridBackground.style.width = widthVal;
          gridBackground.style.height = heightVal;
        }

        if (pageBody) {
          pageBody.style.top = topPos;
          pageBody.style.left = leftPos;
          pageBody.style.width = widthVal;
          pageBody.style.height = heightVal;
        }

        // 2. Sinh Lưới Ô li Nền
        updateFontGrid(type, style, gridColor, pageMargin);

        // 3. Cập nhật Tiêu đề phiếu (Header)
        if (displaySheetTitle) {
          displaySheetTitle.textContent = sheetTitle || "PHIẾU TẬP VIẾT";
        }

        // 4. Tính toán cỡ chữ PT tương ứng
        const paperSizeKey = type.includes("2mm") ? "2mm" : "2.5mm";
        const ptSize = FONT_SIZE_MAP[paperSizeKey][sizeType];
        if (fontSizeNote) {
          fontSizeNote.textContent = `Kích thước tương ứng: ${ptSize} pt`;
        }

        // 5. Cập nhật Tiêu đề bài viết (nếu có)
        const hasTitle = contentTitle.trim().length > 0;
        if (displayContentTitle) {
          if (hasTitle) {
            displayContentTitle.style.display = "block";
            displayContentTitle.textContent = contentTitle;
            displayContentTitle.style.fontFamily = `"${font}", sans-serif`;
            displayContentTitle.style.fontSize = `${ptSize}pt`;
            displayContentTitle.style.lineHeight = `${lineSpacing}mm`;
            displayContentTitle.style.color = textColor;
            displayContentTitle.style.textAlign = "center";
            displayContentTitle.style.paddingLeft = "0";
            displayContentTitle.style.paddingTop = `${baselineOffset}mm`;
          } else {
            displayContentTitle.style.display = "none";
          }
        }

        // 6. Cập nhật Nội dung bài viết
        if (displayContentText) {
          displayContentText.textContent = contentText;
          displayContentText.style.fontFamily = `"${font}", sans-serif`;
          displayContentText.style.fontSize = `${ptSize}pt`;
          displayContentText.style.color = textColor;
          displayContentText.style.lineHeight = `${lineSpacing}mm`;
          displayContentText.style.paddingTop = hasTitle
            ? "0"
            : `${baselineOffset}mm`;
          displayContentText.style.paddingLeft = `${leftMargin}mm`;
        }
      }

      // --- BỘ ĐỒNG BỘ MÀU & MÃ HEX ---
      if (gridColorEl && gridColorHexEl) {
        gridColorEl.addEventListener("input", () => {
          gridColorHexEl.value = gridColorEl.value;
          renderPreview();
        });
        gridColorHexEl.addEventListener("change", () => {
          if (/^#[0-9A-F]{6}$/i.test(gridColorHexEl.value)) {
            gridColorEl.value = gridColorHexEl.value;
            renderPreview();
          }
        });
      }

      if (textColorEl && textColorHexEl) {
        textColorEl.addEventListener("input", () => {
          textColorHexEl.value = textColorEl.value;
          renderPreview();
        });
        textColorHexEl.addEventListener("change", () => {
          if (/^#[0-9A-F]{6}$/i.test(textColorHexEl.value)) {
            textColorEl.value = textColorHexEl.value;
            renderPreview();
          }
        });
      }

      // --- BỘ ĐIỀU KHIỂN ZOOM ---
      function applyZoom(zoom) {
        currentZoom = Math.max(0.3, Math.min(2.0, zoom));
        if (a4Page) {
          a4Page.style.transform = `scale(${currentZoom})`;
        }
        if (zoomLevelEl) {
          zoomLevelEl.textContent = `${Math.round(currentZoom * 100)}%`;
        }
      }

      if (btnZoomIn)
        btnZoomIn.addEventListener("click", () => applyZoom(currentZoom + 0.1));
      if (btnZoomOut)
        btnZoomOut.addEventListener("click", () =>
          applyZoom(currentZoom - 0.1),
        );

      if (btnZoomFit) {
        btnZoomFit.addEventListener("click", () => {
          if (!previewViewport) return;
          const viewportHeight = previewViewport.clientHeight - 80;
          const pageHeightPx = 297 * 3.779527559;
          const fitRatio = viewportHeight / pageHeightPx;
          applyZoom(fitRatio);
        });
      }

      // --- NÚT IN PDF ---
      if (btnPrintPDF) {
        btnPrintPDF.addEventListener("click", () => {
          const oldZoom = currentZoom;
          applyZoom(1);
          window.print();
          applyZoom(oldZoom);
        });
      }

      // --- ĐĂNG KÝ EVENT LISTENERS CẬP NHẬT REALTIME ---
      const allInputs = [
        gridTypeEl,
        gridStyleEl,
        pageMarginEl,
        sheetTitleEl,
        contentTitleEl,
        contentTextEl,
        fontFamilyEl,
        fontSizeTypeEl,
        lineSpacingEl,
        baselineOffsetEl,
        leftMarginEl,
      ].filter(Boolean);

      allInputs.forEach((input) => {
        input.addEventListener("input", renderPreview);
        input.addEventListener("change", renderPreview);
      });

      // Khởi tạo ứng dụng
      window.addEventListener("DOMContentLoaded", () => {
        renderPreview();
        setTimeout(() => {
          if (btnZoomFit) btnZoomFit.click();
        }, 100);
      });
    </script>
  </body>
</html>
